name: ci

on:
  push:
  workflow_dispatch:

jobs:
  ci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-java@v1
        with:
          java-version: '22.0.1'
      - uses: subosito/flutter-action@v1
        with:
          flutter-version: '3.27.2'
      - run: flutter pub get
      - name: run lint
        run: flutter analyze
      - name: run test
        run: flutter test
